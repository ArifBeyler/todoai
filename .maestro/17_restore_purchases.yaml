appId: com.arifbeyler.doara
---
# Restore purchases flow on a non-premium profile. We only tap the banner —
# the actual restore result depends on the sandbox account state. The point
# of this test is to ensure the restore entry-point is reachable and the app
# does not crash when it is used.
- launchApp
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    id: "tab-home"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    text: "Doara, http://.*:8081"
    optional: true
- tapOn:
    text: "Doara"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

- tapOn:
    id: "tab-profile"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000

# Only meaningful when the user is not premium.
- runFlow:
    when:
      visible:
        id: "profile-restore-purchases-banner"
    commands:
      - tapOn:
          id: "profile-restore-purchases-banner"
      - waitForAnimationToEnd:
          timeout: 6000

      # We expect one of the two dialogs RevenueCat will produce.
      - assertVisible:
          text: "Başarılı"
          optional: true
      - assertVisible:
          text: "Geri yükleme"
          optional: true

      - tapOn:
          text: "Tamam"
          optional: true
