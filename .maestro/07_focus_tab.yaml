appId: com.arifbeyler.doara
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    id: "tab-home"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Focus tabına geç
- tapOn:
    id: "tab-focus"
- waitForAnimationToEnd

# Odak oturumunu başlat butonu görünür mü?
- assertVisible:
    id: "btn-start-session"
    optional: true

# Timer geçmişini aç (varsa)
- tapOn:
    text: "Timer geçmişini aç"
    optional: true
- waitForAnimationToEnd
