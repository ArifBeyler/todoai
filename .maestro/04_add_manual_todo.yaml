appId: com.arifbeyler.doara
---
- launchApp
- waitForAnimationToEnd
- repeat:
    times: 12
    commands:
      - tapOn:
          text: "Devam Et"
          optional: true
      - tapOn:
          text: "İleri"
          optional: true
      - tapOn:
          text: "Hadi Başlayalım!"
          optional: true
      - tapOn:
          id: "paywall-dismiss"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1200
- tapOn:
    id: "tab-home"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Manuel görev ekle butonuna tıkla
- tapOn:
    id: "add-todo-fab"
    optional: true
- tapOn:
    text: "Manuel Ekle"
    optional: true
- tapOn:
    text: "Manuel görev ekle"
    optional: true
- waitForAnimationToEnd

# Görev adı gir
- tapOn:
    id: "todo-title-input"
- inputText: "Maestro - Manuel Test Görevi"
- hideKeyboard
- waitForAnimationToEnd

# Kaydet
- tapOn:
    id: "todo-save-button"
- waitForAnimationToEnd
