appId: com.arifbeyler.doara
---
- launchApp
- waitForAnimationToEnd:
    timeout: 6000

# Alışkanlıklar segmentine geç
- tapOn:
    text: "Alışkanlıklar"
- waitForAnimationToEnd:
    timeout: 6000

# Hedefler segmentine geç
- tapOn:
    text: "Hedefler"
- waitForAnimationToEnd:
    timeout: 6000

# Stats kısayollarını doğrula (testID)
- assertVisible:
    id: "stat-completed"
- assertVisible:
    id: "stat-active"
- assertVisible:
    id: "stat-completion-rate"

# Tamamlanan ekranına git
- tapOn:
    id: "stat-completed"
- waitForAnimationToEnd:
    timeout: 5000
- back
- waitForAnimationToEnd:
    timeout: 5000

# Aktif ekranına git
- tapOn:
    id: "stat-active"
- waitForAnimationToEnd:
    timeout: 5000
- back
- waitForAnimationToEnd:
    timeout: 5000
