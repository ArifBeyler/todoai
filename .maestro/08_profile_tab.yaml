appId: com.arifbeyler.doara
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    id: "tab-home"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Profil tabına geç
- tapOn:
    id: "tab-profile"
    optional: true
- waitForAnimationToEnd

# Profil ekranı elementlerini doğrula (ücretsiz kullanıcı)
- assertVisible:
    text: "Premium'a Yükselt"
    optional: true
- assertVisible:
    text: "Ücretsiz"
    optional: true
- assertVisible:
    id: "profile-restore-purchases-banner"
    optional: true

# Scroll yaparak Ayarlar, Çıkış yap elementlerini gör
- scroll
- waitForAnimationToEnd
- assertVisible:
    text: "Çıkış yap"
    optional: true
