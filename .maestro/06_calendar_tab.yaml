appId: com.arifbeyler.doara
---
- launchApp
- waitForAnimationToEnd
- tapOn:
    id: "tab-home"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Takvim tabına geç
- tapOn:
    id: "tab-calendar"
- waitForAnimationToEnd

# Hafta navigasyon butonları her zaman görünür olmalı
- assertVisible:
    id: "btn-prev-week"
- assertVisible:
    id: "btn-next-week"

# Sonraki haftaya git
- tapOn:
    id: "btn-next-week"
- waitForAnimationToEnd

# Eğer dev tools açılırsa kapat (dev build quirk)
- tapOn:
    text: "Kapat"
    optional: true
- waitForAnimationToEnd

# "Bugüne git" butonu (artık bugün seçili değilken görünür)
- assertVisible:
    id: "btn-go-today"
    optional: true

# Önceki haftaya dön
- tapOn:
    id: "btn-prev-week"
    optional: true
- waitForAnimationToEnd
