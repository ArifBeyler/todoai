appId: com.arifbeyler.doara
---
- launchApp
- waitForAnimationToEnd:
    timeout: 8000

# Dev Client sunucu listesi geldiyse projeyi seç
- tapOn:
    text: "Doara, http://.*:8081"
    optional: true
- tapOn:
    text: "Doara"
    optional: true
- tapOn:
    text: "İleri"
    optional: true
- waitForAnimationToEnd:
    timeout: 9000

# Dev menu overlay çıkarsa kapat
- tapOn:
    text: "Kapat"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 12
    commands:
      - tapOn:
          text: "Devam Et"
          optional: true
      - tapOn:
          text: "İleri"
          optional: true
      - tapOn:
          text: "Hadi Başlayalım!"
          optional: true
      - tapOn:
          id: "paywall-dismiss"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1200
- tapOn:
    id: "tab-home"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# 1. todo
- tapOn:
    id: "add-todo-fab"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "todo-title-input"
- inputText: "Maestro Uretim Test 1"
- hideKeyboard
- tapOn:
    id: "todo-save-button"
- waitForAnimationToEnd:
    timeout: 5000

# 2. todo
- tapOn:
    id: "add-todo-fab"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "todo-title-input"
- inputText: "Maestro Uretim Test 2"
- hideKeyboard
- tapOn:
    id: "todo-save-button"
- waitForAnimationToEnd:
    timeout: 5000

# 3. todo
- tapOn:
    id: "add-todo-fab"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "todo-title-input"
- inputText: "Maestro Uretim Test 3"
- hideKeyboard
- tapOn:
    id: "todo-save-button"
- waitForAnimationToEnd:
    timeout: 8000

# 3 todo sonrasında bildirim prompt'u gelebilir, akışı kapat
- tapOn:
    text: "Daha Sonra"
    optional: true
- tapOn:
    text: "Bildirimleri Aç"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# "Görev" recurrence'i Hedefler segmentinde listelenir
- tapOn:
    text: "Hedefler"
- waitForAnimationToEnd:
    timeout: 5000

# En az bir task görünür olmalı
- assertVisible:
    text: "Maestro Uretim Test 1"
    optional: true

# Üretim başladığında hem hero hem banner kullanıcıya anlamlı kopya göstermeli.
# Test artık yalnızca spinner yerine, anlamlı "N görev için görsel üretimi başladı" kopyasını
# ve per-task chip'lerden en az birini ya da sayaç'ı doğruluyor.
- assertVisible:
    id: "hero-generation-card"
    optional: true
- assertVisible:
    id: "generation-batch-header"
    optional: true
- assertVisible:
    text: ".*görev için görsel üretimi başladı.*"
    optional: true
- assertVisible:
    id: "visual-generation-banner"
    optional: true
- assertVisible:
    id: "visual-generation-banner-counter"
    optional: true
- assertVisible:
    id: "generation-progress-counter"
    optional: true

# Progress counter anlamlı N/M biçiminde olmalı.
- assertVisible:
    text: ".*0/3.*|.*1/3.*|.*2/3.*|.*3/3.*"
    optional: true

# Her todo için UI'da net bir durum chip'i görünmeli (en az biri yeterli).
- assertVisible:
    id: "task-generation-queued"
    optional: true
- assertVisible:
    id: "task-generation-generating"
    optional: true
- assertVisible:
    id: "task-generation-ready"
    optional: true
- assertVisible:
    id: "task-visual-pending"
    optional: true
