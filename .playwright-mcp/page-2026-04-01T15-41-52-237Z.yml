        - heading "Auto-Renewable Subscriptions" [level=3] [ref=e87]
        - paragraph [ref=e88]:
          - generic [ref=e89]:
            - text: A subscription is a product that allows users to purchase dynamic content for a set period. This type of subscription renews automatically unless cancelled by the user. Once your binary has been uploaded and your first subscription has been submitted for review, additional subscriptions can be submitted using the table below.
            - link "Learn More" [ref=e90] [cursor=pointer]:
              - /url: https://developer.apple.com/help/app-store-connect/manage-subscriptions/offer-auto-renewable-subscriptions
        - generic [ref=e91]:
          - heading "Subscription Groups" [level=3] [ref=e95]
          - generic [ref=e98]:
            - paragraph [ref=e99]:
              - generic [ref=e100]:
                - text: You can create a subscription after you create a subscription group. All subscriptions must be a part of a group. Users can only subscribe to one subscription in a group at a time, but can change to another subscription in the same group. If they do, you'll still receive 85% of the proceeds in the second year (after tax, if applicable).
                - link "Learn More" [ref=e101] [cursor=pointer]:
                  - /url: https://developer.apple.com/help/app-store-connect/manage-subscriptions/offer-auto-renewable-subscriptions
            - button "Create" [ref=e103] [cursor=pointer]
        - generic [ref=e104]:
          - heading "Billing Grace Period" [level=5] [ref=e106]
          - paragraph [ref=e107]:
            - generic [ref=e108]:
              - text: A billing grace period lets subscribers retain access to your app's paid content even after their subscription expires due to a billing issue. If Apple successfully recovers the subscription during this grace period, you will not experience any interruption in your revenue.
              - link "Learn more" [ref=e109] [cursor=pointer]:
                - /url: https://developer.apple.com/help/app-store-connect/manage-subscriptions/enable-billing-grace-period-for-auto-renewable-subscriptions
          - paragraph [ref=e112]:
